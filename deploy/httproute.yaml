---
# The SPA, on both soil-metrics.sthomas.ch and soil-metrics-web.sthomas.ch
# (-web is the name the legacy nginx vhost used; the bare one is the nicer URL).
# The API + datasets live on soil-metrics-ws.sthomas.ch (start-hack-backend
# repo) - VITE_API_URL points there. TLS: the *.sthomas.ch wildcard covers both.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soil-metrics-web
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - soil-metrics.sthomas.ch
    - soil-metrics-web.sthomas.ch
  rules:
    - backendRefs:
        - name: soil-metrics-web
          port: 80
