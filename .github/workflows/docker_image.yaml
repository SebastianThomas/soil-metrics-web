name: Docker Image CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.*'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            sthomasch/soil-metrics-web:latest
            sthomasch/soil-metrics-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Roll the freshly-pushed image out to K3s. Tag builds only; a manual
  # dispatch from a branch just publishes :latest. deploy.yaml also runs
  # standalone ("Run workflow") to redeploy any already-built tag.
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
