name: deploy
run-name: "deploy @ ${{ inputs.tag }}"

# Deploy the soil-metrics-web SPA to K3s (namespace start-hack).
#   - called by "Docker Image CI" right after it pushes the image for a v* tag
#   - or run manually ("Run workflow") against any already-built tag
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to deploy (image must already be built, e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (image must already be built, e.g. v1.2.3)
        required: true
        type: string

concurrency:
  group: deploy-soil-metrics-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01

      - uses: SebastianThomas/homelab-actions/kube-deploy@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: start-hack
          manifests: deploy
          images: |
            WEB_IMAGE=sthomasch/soil-metrics-web:${{ inputs.tag }}
          rollout: deployment/soil-metrics-web
          rollout-timeout: 180s
